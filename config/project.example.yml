# mfdoc project configuration — starter template
#
# Copy this file to the root of the codebase being documented (as project.yml),
# fill in the placeholders below, and commit it. The config is the record of
# how the index was built, so keeping it in version control alongside the
# generated docs is what makes a documentation run reproducible six months
# later when somebody disputes a business rule.
#
# For a fully worked example pointed at this repo's own sample source, see
# the root `project.yml` and `examples/outputs/`.

project: <PROJECT NAME>          # e.g. Order Management
system: <SYSTEM CODE>            # short code used to group generated docs, e.g. OM
index_db: .mfdoc/index.db
docs_root: docs/functional

# ---------------------------------------------------------------- source sets
#
# Order matters only for readability. Each entry becomes one or more members.
#
#   path              file or directory, relative to this config
#   glob              patterns within a directory (default **/*)
#   dialect           pin it rather than relying on sniffing, once you know it
#   library           Natural library / Mantis library / PDS name
#   system            logical subsystem, used to group generated docs
#   encoding          force a code page, e.g. cp037, cp500; omit to auto-detect
#   sequence_columns  'auto' (default), 'none', or '73:80' to force
#
sources:
  - path: source/natural
    glob: ["*.nsp", "*.nsn", "*.nss", "*.nsc", "*.nsm", "*.txt", "*.lst"]
    dialect: natural
    library: <NATURAL LIBRARY>
    system: <SYSTEM CODE>
    sequence_columns: auto

  - path: source/ddm
    glob: ["*.ddm", "*.txt", "*.lst"]
    dialect: ddm
    system: <SYSTEM CODE>

  - path: source/fdt
    glob: ["*.fdt", "*.rep", "*.txt", "*.lst"]
    dialect: adabas_fdt
    system: <SYSTEM CODE>

  # Delete or add source sets for the dialects actually present in this
  # codebase: mantis, supra_dir, sql_ddl, cobol_copybook, jcl, cics_csd.

# -------------------------------------------------------------------- options
options:
  # Member splitters for concatenated unload files, keyed by dialect. These
  # override the shipped defaults entirely for that dialect, so include the
  # defaults you still want. Each pattern needs a named group `name`, and may
  # supply `type`.
  splitters: {}
  #   natural:
  #     - '^\*+\s*>{2,}\s*(?P<type>\w+)?\s*(?P<name>[A-Z0-9#\-_&$]{1,32})\s*<{2,}'

  # Thresholds that decide whether a run is fit to build narrative on. These are
  # starting points; tighten them once you have a baseline for the codebase.
  quality_gates:
    min_line_recognition_rate: 0.85
    min_call_resolution_rate: 0.70
    min_entity_definition_rate: 0.80
    max_high_severity_gaps: 50

  # Narrative pass controls
  narrative:
    audience: "business analyst inheriting the system, no mainframe background"
    # Modules per document. 1 keeps citations tight; grouping is for tiny
    # utility modules only.
    modules_per_doc: 1
    include_source_excerpts: true
    max_excerpt_lines: 12
    # Terms the business uses, so generated prose matches their vocabulary
    # rather than inventing synonyms. Extend as SMEs correct drafts.
    lexicon: {}
    #   "SOME-FIELD": "business term"
    # Used only by `mfdoc batch` to report a cost figure; omit to have it
    # report token counts without a dollar amount. Check current per-model
    # pricing before setting these -- it changes.
    # pricing:
    #   input_per_mtok: 3.0
    #   output_per_mtok: 15.0

  # Redaction applied at brief-generation time -- before anything reaches a
  # prompt, not only when a document is rendered. Patterns are regexes for
  # specific values already found in this codebase (exact literals, or
  # shapes like a known account-number format); there are no built-in
  # defaults, since guessing what counts as sensitive in an unfamiliar
  # client's source is exactly the kind of invention this project avoids
  # elsewhere. Matches are replaced with [REDACTED].
  redact:
    enabled: false
    patterns: []
    #   - 'AB123456C'
    #   - 'Tr0ub4dor&3'
