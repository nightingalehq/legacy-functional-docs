# mfdoc project configuration
#
# Copy to the root of the codebase being documented, adjust paths, commit it.
# The config is the record of how the index was built, so keeping it in version
# control alongside the generated docs is what makes a documentation run
# reproducible six months later when somebody disputes a business rule.

project: Mill Order Management
system: MOM
index_db: .mfdoc/index.db
docs_root: docs/functional

# ---------------------------------------------------------------- source sets
#
# Order matters only for readability. Each entry becomes one or more members.
#
#   path              file or directory, relative to this config
#   glob              patterns within a directory (default **/*)
#   dialect           pin it rather than relying on sniffing, once you know it
#   library           Natural library / Mantis library / PDS name
#   system            logical subsystem, used to group generated docs
#   encoding          force a code page, e.g. cp037, cp500; omit to auto-detect
#   sequence_columns  'auto' (default), 'none', or '73:80' to force
#
sources:
  - path: examples/inputs/natural
    glob: ["*.nsp", "*.nsn", "*.nss", "*.nsc", "*.nsm", "*.txt", "*.lst"]
    dialect: natural
    library: MILLPROD
    system: MOM
    sequence_columns: auto

  - path: examples/inputs/ddm
    glob: ["*.ddm", "*.txt", "*.lst"]
    dialect: ddm
    system: MOM

  - path: examples/inputs/fdt
    glob: ["*.fdt", "*.rep", "*.txt", "*.lst"]
    dialect: adabas_fdt
    system: MOM

  - path: examples/inputs/mantis
    glob: ["*.mantis", "*.mts", "*.txt"]
    dialect: mantis
    library: STEELLIB
    system: OE

  - path: examples/inputs/supra
    glob: ["*.dir", "*.txt", "*.rep"]
    dialect: supra_dir
    system: OE

  - path: examples/inputs/ddl
    glob: ["*.sql", "*.ddl"]
    dialect: sql_ddl
    system: MOM

  - path: examples/inputs/jcl
    glob: ["*.jcl", "*.job", "*.txt"]
    dialect: jcl
    system: MOM

  - path: examples/inputs/csd
    glob: ["*.csd", "*.txt"]
    dialect: cics_csd
    system: MOM

# -------------------------------------------------------------------- options
options:
  # Member splitters for concatenated unload files, keyed by dialect. These
  # override the shipped defaults entirely for that dialect, so include the
  # defaults you still want. Each pattern needs a named group `name`, and may
  # supply `type`.
  splitters: {}
  #   natural:
  #     - '^\*+\s*>{2,}\s*(?P<type>\w+)?\s*(?P<name>[A-Z0-9#\-_&$]{1,32})\s*<{2,}'

  # mfdoc validate's reversed-condition check (conditions.py). Deliberately
  # no default here beyond the built-in RETURN-CODE/RESPONSE-CODE/STATUS/
  # STAT/FLAG/RC denylist -- set this only if this codebase's outcome fields
  # (return/response/status codes, flags) use different naming conventions
  # the built-in pattern doesn't cover; a supplied pattern replaces the
  # built-in one rather than extending it.
  validate: {}
  #   outcome_field_pattern: '\bRESULT\b'

  # Thresholds that decide whether a run is fit to build narrative on. These are
  # starting points; tighten them once you have a baseline for the codebase.
  quality_gates:
    min_line_recognition_rate: 0.85
    min_call_resolution_rate: 0.70
    min_entity_definition_rate: 0.80
    max_high_severity_gaps: 50

  # Narrative pass controls
  narrative:
    audience: "business analyst inheriting the system, no mainframe background"
    # Modules per document. 1 keeps citations tight; grouping is for tiny
    # utility modules only.
    modules_per_doc: 1
    include_source_excerpts: true
    max_excerpt_lines: 12
    # Terms the client uses, so generated prose matches the business vocabulary
    # rather than inventing synonyms. Extend as SMEs correct drafts.
    lexicon:
      "MILL-ORDER": "mill order"
      "HEAT-NO": "heat number"
      "CAST-DATE": "cast date"
      "GRADE-CODE": "steel grade"
      "RLSD": "released to production"
      "CONF": "confirmed"
      "PART": "partially released"
    # Used only by `mfdoc batch` to report a cost figure; omit to have it
    # report token counts without a dollar amount. Check current per-model
    # pricing before setting these -- it changes.
    # pricing:
    #   input_per_mtok: 3.0
    #   output_per_mtok: 15.0

  # Redaction applied at brief-generation time -- before anything reaches a
  # prompt, not only when a document is rendered. Patterns are regexes for
  # specific values already found in this codebase; there are no built-in
  # defaults. Matches are replaced with [REDACTED].
  redact:
    enabled: false
    patterns: []

  # Optional test-generation pass (test-plan/test-advisory/test-overlay-draft/
  # test-gen/test-batch/test-validate -- see
  # docs/guides/testing-strategies-for-mainframes-and-4gl.md). Everything
  # here is a default only: every key has an equivalent CLI flag
  # (--language/--framework/--overlay/--out) that overrides it for a single
  # run. Omit this whole block to keep passing --language/--framework on
  # every test-gen/test-batch invocation -- there is no built-in default,
  # same policy as the dialect/redaction config above.
  testgen:
    # No built-in default -- this is the destination stack a migration team
    # actually wants, not a guess. Required (here or via --language/
    # --framework) before test-gen/test-batch will run. Uncomment and set
    # to your team's actual target, e.g.:
    # default_language: python
    # default_framework: pytest
    # test-overlay.yml path, relative to this config file. test-plan reads
    # promoted entries from it; test-overlay-draft writes proposals to it.
    overlay_path: test-overlay.yml
    # test-batch's output directory, relative to this config file.
    out_dir: tests_generated
    # The full set of destination targets this project wants rendered by
    # `mfdoc test-batch --matrix` / `mfdoc test-gen --matrix` in one pass.
    # No built-in default matrix -- this is the same "declare it, don't
    # guess it" posture options.testgen already takes for
    # default_language/default_framework.
    matrix:
      - {language: python, framework: pytest}
      - {language: natural, framework: natunit}
      - {language: mantis, framework: native}
      - {language: silkcentral, framework: testcase}
      - {language: uipath, framework: testcase}
